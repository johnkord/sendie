server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers (Phase 4). The CSP intentionally pins connect-src to
    # 'self' rather than blanket-allowing wss: — SignalR connects same-origin
    # and we do not want to permit arbitrary WebSocket destinations.
    # worker-src includes blob: for the StreamSaver service worker, which
    # is now self-hosted under /streamsaver/.
    #
    # IMPORTANT: nginx's `add_header` does NOT inherit into a location block
    # that has its own `add_header`. Any `location { add_header ... }` below
    # MUST re-emit the security set, or the response will be missing them.
    # See https://nginx.org/en/docs/http/ngx_http_headers_module.html#add_header
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' https://cdn.discordapp.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; worker-src 'self' blob:; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;

    # Cache static assets. We re-emit the security headers below; any location
    # with its own add_header silently drops the server-level ones.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' https://cdn.discordapp.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; worker-src 'self' blob:; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    # The SPA bootstrap document must not be cached so users always pull
    # the latest hashed bundle pointers after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' https://cdn.discordapp.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; worker-src 'self' blob:; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # robots.txt blocks indexing of session URLs in case one ever leaks
    # into a referer / sitemap / public paste.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' https://cdn.discordapp.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; worker-src 'self' blob:; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
